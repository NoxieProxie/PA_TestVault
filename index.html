<script>
/* seasonal looks: change the dates here when the in-game events move (month-day, both days included) */
window.NWSEASONS=[
  {k:'winter', n:'Winter Convergence', from:'12-01', to:'01-08', c:'#9fd0e6'},
  {k:'lunar',  n:'Lunar New Year',     from:'01-20', to:'02-20', c:'#e8b04a'},

window.nwSeasonNow=function(d){d=d||new Date();var md=('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
